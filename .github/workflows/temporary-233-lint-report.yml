name: Temporary lint diagnostics issue 233
on:
  push:
    branches:
      - feature/233-external-ssh-provider
permissions:
  contents: read
jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup build environment
        uses: ./.github/reusable-workflows/setup-gradle
        with:
          java-version: 21
      - name: Run lint and print full findings
        shell: bash
        run: |
          ./gradlew :app:lintDebug || true
          report=$(find app/build/intermediates -name lint-results-debug.txt -type f -print -quit)
          if [ -z "$report" ]; then echo "No lint report found"; exit 1; fi
          echo "FULL_LINT_REPORT_BEGIN"
          cat "$report"
          echo "FULL_LINT_REPORT_END"
